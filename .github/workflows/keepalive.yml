name: DB health monitor

# Hits /api/health hourly. The endpoint queries the real `packers` table, so
# this serves two jobs at once:
#   1. Keep-alive — a bare SELECT 1 did NOT stop the Supabase free-tier ~7-day
#      idle auto-pause (paused twice in Jun 2026); a real table query does.
#   2. Uptime monitor — on a non-2xx response (DB down / unreachable / empty
#      schema) the check fails and this workflow opens a GitHub Issue assigned
#      to the repo owner (which emails them via issue-assignment notifications,
#      so it does NOT depend on the account-level Actions email setting). The
#      issue auto-closes once health checks pass again.
#
# To test alerting without a real outage: Actions tab > DB health monitor >
# "Run workflow" > set "simulate_failure" to true. It opens the alert issue
# (emailing you); the next healthy run auto-closes it.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force the health check to fail (to test alerting)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DB health endpoint
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "simulate_failure=true — forcing a failure to test alerting."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            https://salary-info-collection-app.vercel.app/api/health

      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create db-alert --color B60205 \
            --description "Automated DB health alert" 2>/dev/null || true
          open=$(gh issue list --label db-alert --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "Alert issue already open — not duplicating."
            exit 0
          fi
          gh issue create \
            --title "DB health check is failing" \
            --label db-alert \
            --assignee "${{ github.repository_owner }}" \
            --body "The DB health monitor failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          /api/health returned a non-2xx response — the Supabase database is likely paused or unreachable.

          Fix: open the Supabase dashboard and restore the project if it is paused: https://supabase.com/dashboard/project/oknkkpjcuendiqzaqyrc

          This issue was opened automatically and will auto-close once health checks pass again."

      - name: Close alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label db-alert --state open --json number --jq '.[].number'); do
            gh issue close "$n" \
              --comment "Health check is passing again. Auto-closed by the DB health monitor."
          done
